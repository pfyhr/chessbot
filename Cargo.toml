[workspace]
resolver = "2"
members = [
    "crates/az-core",
    "crates/az-perft",
    "crates/az-py",
    "crates/az-wasm",
]
# az-wasm only makes sense for wasm32; building a host cdylib of it on every
# `cargo build` is pure waste. It stays a member so it shares the lockfile.
default-members = [
    "crates/az-core",
    "crates/az-perft",
    "crates/az-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Perft and self-play are measured in release mode only; debug builds are
# 20-50x slower and any timing taken from them is meaningless.
[profile.bench]
inherits = "release"
