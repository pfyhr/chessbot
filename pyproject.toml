[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "chessbot-core"
description = "Rust core for an AlphaZero-style chess engine"
requires-python = ">=3.11"
classifiers = ["Programming Language :: Rust"]
dynamic = ["version"]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=9.0", "chess>=1.11"]

[project.scripts]
c4-play = "chessbot.play_connect4:main"
c4-train = "chessbot.train_connect4:main"
c4-report = "chessbot.connect4_report:main"
chess-train = "chessbot.train_chess:main"
chess-report = "chessbot.chess_report:main"

[tool.maturin]
manifest-path = "crates/az-py/Cargo.toml"
module-name = "chessbot_core._core"
features = ["extension-module"]
# Install the pure-Python `chessbot` package alongside the Rust extension, so
# `python -m chessbot.play_connect4` works from the venv with no PYTHONPATH.
python-source = "python"
# Build in release even for `maturin develop`: a debug-build core is 20-50x
# slower and would make every throughput number meaningless.
profile = "release"

[tool.pytest.ini_options]
# The `chessbot` package lives under python/ rather than at the repo root, so put
# it on the path here instead of requiring PYTHONPATH on every invocation.
pythonpath = ["python"]
testpaths = ["tests"]
